name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typescript:
    name: Lint & Format (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Test complexity reporter
        run: npm run test:lint-complexity

      - name: Check Prettier formatting
        run: npm run format:check

  typecheck-typescript:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: TypeCheck all packages
        run: npm run typecheck

  build-web:
    name: Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Build web package
        run: npm run build -w @open-inspect/web

  lint-python-sandbox-runtime:
    name: Lint & Format (Python - sandbox-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

  typecheck-python-sandbox-runtime:
    name: TypeCheck (Python - sandbox-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-python-sandbox-runtime]
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run MyPy
        run: mypy src/
        continue-on-error: true # Allow failures initially as types are added

  test-cp-unit:
    name: Test (control-plane unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run shared tests
        run: npm test -w @open-inspect/shared

      - name: Run control-plane unit tests
        run: npm test -w @open-inspect/control-plane

  test-cp-integration:
    name: Test (control-plane integration ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Install workerd runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libc++1

      - name: Run control-plane integration tests
        run: npm run test:integration -w @open-inspect/control-plane -- --shard=${{ matrix.shard }}

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run web tests
        run: npm test -w @open-inspect/web

  test-bots:
    name: Test (bots)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run github-bot tests
        run: npm test -w @open-inspect/github-bot

      - name: Run slack-bot tests
        run: npm test -w @open-inspect/slack-bot

  test-python-sandbox-runtime:
    name: Test (Python - sandbox-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-python-sandbox-runtime]
    defaults:
      run:
        working-directory: packages/sandbox-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Deploy (wrangler)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        lint-typescript,
        typecheck-typescript,
        build-web,
        test-cp-unit,
        test-cp-integration,
        test-web,
        test-bots,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore generated secrets cache
        # scripts/setup.sh generates a fixed set of internal secrets once
        # (BROWSER_AUTH_SECRET, SERVICE_AUTH_SECRET_*, etc.) and caches them in
        # a local .secrets file so re-running it doesn't rotate them. Terraform
        # used to keep the equivalent (`random_password` resources) in its own
        # state file across runs; this cache is the wrangler-only replacement.
        # Losing this cache invalidates every existing session/cookie signed
        # with the old values on the next deploy — worth a real secrets-store
        # solution (e.g. a private GH Actions cache scope, or 1Password/Vault)
        # rather than the actions/cache best-effort default for anything past
        # early bring-up.
        uses: actions/cache@v4
        with:
          path: .secrets
          key: open-inspect-generated-secrets

      - name: Deploy all workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.OI_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.OI_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.OI_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OI_GITHUB_CLIENT_SECRET }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.OI_GITHUB_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OI_GOOGLE_CLIENT_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.OI_SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.OI_SLACK_SIGNING_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.OI_ANTHROPIC_API_KEY }}
        run: ./scripts/setup.sh
