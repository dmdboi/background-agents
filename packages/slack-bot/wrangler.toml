# Production-capable wrangler config for the slack-bot Worker.
# Replaces the Terraform module in terraform/environments/production/workers-slack.tf.
# Placeholder ids/urls below must be filled in (scripts/setup.sh does the
# resource-creation parts; edit vars by hand for your deployment).

name = "open-inspect-slack-bot"
main = "dist/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace for Slack install state, thread/session mapping, and config.
[[kv_namespaces]]
binding = "SLACK_KV"
id = ""  # Fill in after: wrangler kv namespace create SLACK_KV

# Service binding to the control plane worker (worker-to-worker calls).
[[services]]
binding = "CONTROL_PLANE"
service = "open-inspect-control-plane"

# Queue for delivering completion notifications back to Slack.
[[queues.producers]]
binding = "SLACK_COMPLETION_QUEUE"
queue = "open-inspect-slack-completion"

[[queues.consumers]]
queue = "open-inspect-slack-completion"
dead_letter_queue = "open-inspect-slack-completion-dlq"
max_batch_size = 1
# Terraform's cloudflare_queue_consumer used max_wait_time_ms=1000;
# wrangler's config schema only exposes this in seconds.
max_batch_timeout = 1
max_concurrency = 5
max_retries = 1
retry_delay = 15

[vars]
CONTROL_PLANE_URL = "https://open-inspect-control-plane.YOUR-SUBDOMAIN.workers.dev"
WEB_APP_URL = "https://your-web-app.example.com"
DEPLOYMENT_NAME = "production"
APP_NAME = "Open-Inspect"
DEFAULT_MODEL = "claude-haiku-4-5"
CLASSIFICATION_MODEL = "claude-haiku-4-5"
# Kill switch for Slack channel-message triggers; the bot only ingests/
# forwards channel messages when this is exactly "true" (dark by default).
SLACK_TRIGGERS_ENABLED = "false"

[observability]
enabled = true

# Secrets (set via `wrangler secret put`, never checked in):
# - SLACK_BOT_TOKEN        (operator-supplied; shared with control-plane's slack-notify)
# - SLACK_SIGNING_SECRET   (operator-supplied)
# - ANTHROPIC_API_KEY      (operator-supplied)
# - SERVICE_AUTH_SECRET    (auto-generated by scripts/setup.sh; sig1-signs calls to control-plane)
