# Production-capable wrangler config for the linear-bot Worker.
# Replaces the Terraform module in terraform/environments/production/workers-linear.tf.
# Placeholder ids/urls below must be filled in (scripts/setup.sh does the
# resource-creation parts; edit vars by hand for your deployment). Also
# works for local `wrangler dev` — override DEPLOYMENT_NAME etc. as needed.

name = "open-inspect-linear-bot"
main = "dist/index.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# KV namespace for the runtime-token cache, issue-to-session mapping, and config
[[kv_namespaces]]
binding = "LINEAR_KV"
id = ""  # Fill in after creating: wrangler kv namespace create LINEAR_KV

# Service binding to the control plane worker (worker-to-worker calls).
# There is no queue for linear-bot (unlike slack-bot) — Terraform does not
# define one and this config intentionally matches that.
[[services]]
binding = "CONTROL_PLANE"
service = "open-inspect-control-plane"

[vars]
DEPLOYMENT_NAME = "production"
CONTROL_PLANE_URL = "https://open-inspect-control-plane.YOUR-SUBDOMAIN.workers.dev"
WEB_APP_URL = "https://your-web-app.example.com"
DEFAULT_MODEL = "claude-sonnet-4-6"
LINEAR_CLIENT_ID = ""  # From Linear OAuth Application
WORKER_URL = "https://open-inspect-linear-bot.YOUR-SUBDOMAIN.workers.dev"

[observability]
enabled = true

# Secrets (set via `wrangler secret put`, never checked in):
# - LINEAR_WEBHOOK_SECRET   (operator-supplied)
# - LINEAR_CLIENT_SECRET    (operator-supplied)
# - SERVICE_AUTH_SECRET     (auto-generated by scripts/setup.sh; sig1-signs calls to control-plane)
# - ANTHROPIC_API_KEY       (operator-supplied)
# - LINEAR_API_KEY          (operator-supplied)
