# Production-capable wrangler config for the github-bot Worker.
# Replaces the Terraform module in terraform/environments/production/workers-github.tf.
# Placeholder ids/urls below must be filled in (scripts/setup.sh does the
# resource-creation parts; edit vars by hand for your deployment).

name = "open-inspect-github-bot"
main = "dist/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace for webhook dedup, installation cache, and config.
[[kv_namespaces]]
binding = "GITHUB_KV"
id = ""  # Fill in after: wrangler kv namespace create GITHUB_KV

# Service binding to the control plane worker (worker-to-worker calls).
[[services]]
binding = "CONTROL_PLANE"
service = "open-inspect-control-plane"

[vars]
DEPLOYMENT_NAME = "production"
APP_NAME = "Open-Inspect"
DEFAULT_MODEL = "anthropic/claude-haiku-4-5"
GITHUB_BOT_USERNAME = ""  # e.g. "your-app[bot]"

[observability]
enabled = true

# Secrets (set via `wrangler secret put`, never checked in):
# - GITHUB_APP_ID                (operator-supplied)
# - GITHUB_APP_PRIVATE_KEY       (operator-supplied, PKCS#8 PEM)
# - GITHUB_APP_INSTALLATION_ID   (operator-supplied)
# - GITHUB_WEBHOOK_SECRET        (operator-supplied)
# - SERVICE_AUTH_SECRET          (auto-generated by scripts/setup.sh; sig1-signs calls to control-plane)
