# OpenNext Cloudflare Workers configuration for the web app.
# See: https://opennext.js.org/cloudflare
#
# Deploy with `npm run deploy:cloudflare -w @open-inspect/web` (wraps
# `opennextjs-cloudflare deploy`, not plain `wrangler deploy` — OpenNext
# needs to build the .open-next/ bundle first via `build:cloudflare`).
#
# IMPORTANT — build-time vs deploy-time vars:
# NEXT_PUBLIC_* vars are inlined into the client bundle by Next.js at BUILD
# time (`npm run build:cloudflare`), not read at request time like the
# [vars] below. Export them in the shell before building, e.g.:
#   NEXT_PUBLIC_WS_URL=wss://open-inspect-control-plane.YOUR-SUBDOMAIN.workers.dev \
#   NEXT_PUBLIC_SANDBOX_PROVIDER=cloudflare \
#   NEXT_PUBLIC_APP_NAME="Open-Inspect" \
#   NEXT_PUBLIC_APP_SHORT_NAME="Open-Inspect" \
#   NEXT_PUBLIC_APP_ICON_URL="" \
#   npm run build:cloudflare -w @open-inspect/web
# scripts/setup.sh sets these before invoking the build for you; this file
# is the config `wrangler`/`opennextjs-cloudflare` reads once the bundle
# already exists.
#
# For local dev, change `name` back to the "-local" suffix and the service
# binding target to match your local control-plane worker name.

name = "open-inspect-web"
main = ".open-next/worker.js"
compatibility_date = "2025-08-15"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Set to false once a custom domain is attached via
# `wrangler deploy --route` / a zone-managed custom domain — a
# custom-domain deployment should have one canonical browser origin, not
# also serve on *.workers.dev.
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Service binding to the control plane worker (required for same-account worker-to-worker calls)
[[services]]
binding = "CONTROL_PLANE_WORKER"
service = "open-inspect-control-plane"

[vars]
CONTROL_PLANE_URL = "https://open-inspect-control-plane.YOUR-SUBDOMAIN.workers.dev"
# Mirrors the NEXT_PUBLIC_* values baked into the client bundle at build
# time (see comment above) — server-side code reads these at request time.
NEXT_PUBLIC_WS_URL = "wss://open-inspect-control-plane.YOUR-SUBDOMAIN.workers.dev"
NEXT_PUBLIC_SANDBOX_PROVIDER = "cloudflare"
NEXT_PUBLIC_APP_NAME = "Open-Inspect"
NEXT_PUBLIC_APP_SHORT_NAME = "Open-Inspect"
NEXT_PUBLIC_APP_ICON_URL = ""

[observability]
enabled = true

# Secrets (set via `wrangler secret put`, never checked in):
# - SERVICE_AUTH_SECRET   (auto-generated by scripts/setup.sh; sig1-signs calls to control-plane)
#
# Note: Terraform's web-cloudflare.tf also attaches a
# cloudflare_workers_custom_domain resource (hostname -> this Worker,
# managed DNS + edge cert) when a custom domain is configured. There is no
# declarative wrangler.toml field for this — it must be attached via the
# Cloudflare dashboard (Workers & Pages > your worker > Settings > Domains &
# Routes) or the Cloudflare API. scripts/setup.sh does not do this
# automatically; flagged for the operator to do by hand.
